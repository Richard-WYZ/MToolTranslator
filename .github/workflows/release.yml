name: Release

on:
  push:
    branches:
      - master
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "VERSION must use semantic versioning, for example 0.2.0"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Ensure version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $existing = gh release list `
            --repo $env:GITHUB_REPOSITORY `
            --limit 100 `
            --json tagName `
            --jq ".[] | select(.tagName == `"$env:TAG`") | .tagName"
          if ($existing) {
            throw "Release $env:TAG already exists. Increase VERSION first."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        shell: pwsh
        run: tools\run_tests.ps1 -q

      - name: Build portable Windows package
        shell: pwsh
        run: tools\build.ps1

      - name: Package release asset
        id: package
        shell: pwsh
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $asset = "build\MToolTranslator-$env:TAG-windows-x64.zip"
          $files = @(
            "build\dist\MToolTranslator.exe",
            "build\dist\.env"
          )
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) {
              throw "Missing release file: $file"
            }
          }
          $keyLine = Get-Content -LiteralPath "build\dist\.env" |
            Where-Object { $_ -match '^THIRD_PARTY_API_KEY=' }
          if ($keyLine -ne 'THIRD_PARTY_API_KEY=') {
            throw "Packaged .env must not contain an API key."
          }
          Compress-Archive -LiteralPath $files -DestinationPath $asset
          "asset=$asset" >> $env:GITHUB_OUTPUT

      - name: Create tag and GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $env:TAG
          git push origin $env:TAG
          gh release create $env:TAG $env:ASSET `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --generate-notes `
            --title "MToolTranslator $env:TAG"
