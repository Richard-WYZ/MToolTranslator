name: Prepare Windows release artifacts

on:
  workflow_dispatch:
    inputs:
      version:
        description: Confirmed release version matching VERSION (for example 0.5.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Validate confirmed version and release commit
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/master") {
            throw "Artifact preparation must be dispatched from master."
          }
          $version = $env:RELEASE_VERSION.Trim()
          if ($version -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "The confirmed version must use MAJOR.MINOR.PATCH."
          }
          $recordedVersion = (Get-Content -LiteralPath VERSION -Raw).Trim()
          if ($version -ne $recordedVersion) {
            throw "The confirmed version must match VERSION."
          }
          $branch = (& git branch --show-current | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $branch -ne "master") {
            throw "The checkout must be on master."
          }
          $status = (& git status --porcelain | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $status) {
            throw "The release checkout must be clean."
          }
          $headCommit = (& git rev-parse HEAD | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "Unable to read HEAD." }
          $remoteMasterCommit = (& git rev-parse origin/master | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $remoteMasterCommit) {
            throw "The release commit must match origin/master."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=MToolTranslator-v$version-windows-x64" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run required tests
        shell: pwsh
        run: tools\run_tests.ps1 -q

      - name: Build isolated Windows artifact
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: tools\build.ps1 -Version $env:RELEASE_VERSION

      - name: Archive and verify the untouched artifact
        id: package
        shell: pwsh
        env:
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDirectory = Join-Path "build\dist" $env:ARTIFACT_NAME
          $files = @(Get-ChildItem -LiteralPath $artifactDirectory -Force)
          $executable = Join-Path $artifactDirectory "MToolTranslator.exe"
          if ($files.Count -ne 1 -or $files[0].Name -ne "MToolTranslator.exe" -or
              -not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "The untouched artifact directory must contain exactly MToolTranslator.exe."
          }
          $archive = Join-Path "build\dist" "$env:ARTIFACT_NAME.zip"
          $checksum = "$archive.sha256"
          if ((Test-Path -LiteralPath $archive) -or (Test-Path -LiteralPath $checksum)) {
            throw "Artifact archives and checksums must not be overwritten."
          }
          Compress-Archive -LiteralPath $executable -DestinationPath $archive
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try {
            if ($zip.Entries.Count -ne 1 -or $zip.Entries[0].FullName -ne "MToolTranslator.exe") {
              throw "The ZIP must contain exactly MToolTranslator.exe."
            }
            $entryStream = $zip.Entries[0].Open()
            $hashAlgorithm = [System.Security.Cryptography.SHA256]::Create()
            try {
              $entryHash = [System.BitConverter]::ToString($hashAlgorithm.ComputeHash($entryStream)).Replace("-", "")
            }
            finally {
              $entryStream.Dispose()
              $hashAlgorithm.Dispose()
            }
            $executableHash = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash
            if ($entryHash -ne $executableHash) {
              throw "The archived executable does not match the untouched artifact."
            }
          }
          finally { $zip.Dispose() }
          $archiveHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumLine = "$archiveHash  $env:ARTIFACT_NAME.zip`n"
          [System.IO.File]::WriteAllText($checksum, $checksumLine, [System.Text.UTF8Encoding]::new($false))
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Upload prepared artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
